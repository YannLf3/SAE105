<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AudioPhile</title>
    <link rel="stylesheet" href="./css/global.css" />
  </head>

  <body>
    <div id="content">
      <script type="module">

        import { Navigation } from "./component/Navigation3/index.js";

        //import du hero
        import { Hero } from "./component/Hero/index.js";

        //import du product
        import { Product } from "./component/Product/index.js";
        import { ProductData } from "./data/bonBonbon/ProductData.js";

        import { Footer } from "./component/Footer3/index.js";

        import { Showcase } from "./component/Showcase3/index.js";

        //rendus
        Navigation.render("#content", NavigationData[0], "bg--navigation3");
