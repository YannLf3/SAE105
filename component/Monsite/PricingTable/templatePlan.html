<div class="pricing-table__card">
  <h3 class="pricing-table__plan-name">{{name}}</h3>
  <p class="pricing-table__plan-description">{{description}}</p>
  <div class="pricing-table__plan-price">
    <span class="pricing-table__plan-amount">{{price}}</span>
    <span class="pricing-table__plan-period">{{period}}</span>
  </div>
  <ul class="pricing-table__plan-features">
    {{features}}
  </ul>
  <button class="pricing-table__plan-button">{{button}}</button>
</div>
