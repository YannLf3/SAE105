<div class="testimonials__card">
  <div class="testimonials__card-rating">{{stars}}</div>
  <p class="testimonials__card-text">"{{text}}"</p>
  <div class="testimonials__card-author">
    <span class="testimonials__card-avatar">{{avatar}}</span>
    <div class="testimonials__card-info">
      <p class="testimonials__card-name">{{name}}</p>
      <p class="testimonials__card-company">{{company}}</p>
    </div>
  </div>
</div>
