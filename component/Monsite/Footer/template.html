<footer class="footer {{cssClass}}" id="footer">
  <div class="footer__container">
    <div class="footer__content">
      <div class="footer__section">
        <h3 class="footer__brand">
          <span class="footer__logo">✦</span>
          <span>{{brand}}</span>
        </h3>
        <p class="footer__description">{{description}}</p>
      </div>

      <div class="footer__section">
        <h4 class="footer__title">Navigation</h4>
        <ul class="footer__links">
          {{navLinks}}
        </ul>
      </div>

      <div class="footer__section">
        <h4 class="footer__title">Socials</h4>
        <ul class="footer__socials">
          {{socialLinks}}
        </ul>
      </div>

      <div class="footer__section">
        <h4 class="footer__title">Contact</h4>
        <p class="footer__contact">{{contactEmail}}</p>
        <p class="footer__contact">{{contactPhone}}</p>
      </div>
    </div>

    <div class="footer__bottom">
      <p class="footer__copyright">{{copyright}}</p>
    </div>
  </div>
</footer>
