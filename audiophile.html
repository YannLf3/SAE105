<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AudioPhile</title>
    <link rel="stylesheet" href="./css/global.css" />
  </head>

  <body>

        import { Navigation } from "./component/Navigation3/index.js";

        //import du hero
        import { Hero } from "./component/Hero/index.js";
        import { HeroData } from "./data/audiophile/HeroData.js";

        //import du product
        import { Product } from "./component/Product/index.js";

        //import du footer
        import { Footer } from "./component/Footer3/index.js";

        //import du test
        import { About } from "./component/Test/index.js";

        import { Showcase } from "./component/Showcase3/index.js";
        import { ShowcaseData } from "./data/audiophile/ShowcaseData.js";

        //Rendus
        Navigation.render("#content", NavigationData[0]);
        Hero.render("#content", HeroData[0]);
        Product.render("#content", ProductData[0]);
        Showcase.render("#content", ShowcaseData[0]);
